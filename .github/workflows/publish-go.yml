name: Publish Go

on:
  push:
    tags:
      - "fabric-v*"
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: the mirror push force-updates fabric-go's main, so two
# concurrent runs race on the ref ("cannot lock ref refs/heads/main").
# Queue instead of cancel so no publish is dropped.
concurrency:
  group: publish-go
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="v0.0.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to fabric-go repo
        env:
          GH_TOKEN: ${{ secrets.GO_PUBLISH_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir go-publish
          cp fabric/go/*.go go-publish/
          cp fabric/go/go.mod go-publish/
          cp fabric/go/go.sum go-publish/

          # Copy CLI
          mkdir -p go-publish/cmd/fabric
          cp fabric/go/cmd/fabric/*.go go-publish/cmd/fabric/

          cd go-publish
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${VERSION}"
          git tag "${VERSION}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/spacesprotocol/fabric-go.git"
          # Force-mirror main; retry the ref update in case a concurrent run
          # moved it between negotiation and lock (belt-and-suspenders on top
          # of the concurrency group above).
          for attempt in 1 2 3; do
            if git push origin main --force; then
              break
            fi
            echo "main push attempt ${attempt} failed; retrying in 5s"
            sleep 5
          done
          git push origin "${VERSION}"
